<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="RetinaFormer — AI-Assisted Diabetic Retinopathy Screening and Educational Platform. Upload retinal images for AI screening with visual explanations." />
  <meta name="theme-color" content="#0B6E99" />

  <title>RetinaFormer — AI-Assisted Diabetic Retinopathy Screening</title>

  <!-- Preload Inter font for faster LCP -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    /* Critical CSS — prevent FOUC */
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #F8FAFB;
      color: #0F172A;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Loading screen while JS loads */
    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }

    .app-loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E2E8F0;
      border-top-color: #0B6E99;
      border-radius: 50%;
      animation: loading-spin 0.8s linear infinite;
    }

    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .app-loading-text {
      font-size: 14px;
      color: #94A3B8;
    }
  </style>
</head>

<body>
  <div id="root">
    <noscript>
      <div style="padding: 40px; text-align: center; font-family: sans-serif;">
        <h1>RetinaFormer</h1>
        <p>JavaScript is required to use this application.</p>
        <p>Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <div class="app-loading">
      <div class="app-loading-spinner"></div>
      <span class="app-loading-text">Loading RetinaFormer...</span>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
